name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 -m pip install ezdxf==1.4.5 matplotlib==3.11.2 pypdf==6.21.2
      - run: python3 scripts/sync-provider-skills.py --check
      - run: python3 tests/check_repo.py
      - run: python3 -m unittest discover -s tests -v
        env:
          GRIDLINE_REQUIRE_CAD_TESTS: "1"
      - run: python3 skills/architectural-drawing-generation/scripts/aec_draw.py skills/architectural-drawing-generation/references/concept-plan.drawing.json --validate-only
      - run: bash -n scripts/install-global.sh
      - name: Smoke test auto installer
        shell: bash
        run: |
          set -euo pipefail
          T="$(mktemp -d)"
          mkdir -p "$T/home" "$T/bin"
          for x in codex claude gemini; do printf '#!/usr/bin/env sh\nexit 0\n' > "$T/bin/$x"; chmod +x "$T/bin/$x"; done
          HOME="$T/home" CODEX_HOME="$T/home/.codex" PATH="$T/bin:$PATH" bash scripts/install-global.sh auto
          EXPECTED_SKILLS="$(python3 -c 'import json; d=json.load(open("skills/manifest.json")); print(sum(x.get("status")=="stable" for x in d["skills"]))')"
          test "$(find "$T/home/.codex/skills" -name SKILL.md | wc -l)" -eq "$EXPECTED_SKILLS"
          test "$(find "$T/home/.claude/skills" -name SKILL.md | wc -l)" -eq "$EXPECTED_SKILLS"
          test "$(find "$T/home/.gemini/skills" -name SKILL.md | wc -l)" -eq "$EXPECTED_SKILLS"

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Portable topology, GLB and source-selection regressions
        run: |
          python -m unittest discover -s tests -p test_wall_topology.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_glb_qa.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_source_registry.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke test PowerShell installer
        shell: pwsh
        run: |
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP "aas-codex"
          .\scripts\install-global.ps1 all
          $Manifest = Get-Content -Raw "skills/manifest.json" | ConvertFrom-Json
          $ExpectedSkills = @($Manifest.skills | Where-Object { $_.status -eq "stable" }).Count
          $ExpectedAgents = @(Get-ChildItem "agents" -Filter *.md -File).Count
          if ((Get-ChildItem "$env:CODEX_HOME\skills" -Filter SKILL.md -Recurse).Count -ne $ExpectedSkills) { throw "Codex skill count mismatch" }
          if ((Get-ChildItem "$HOME\.claude\skills" -Filter SKILL.md -Recurse).Count -ne $ExpectedSkills) { throw "Claude skill count mismatch" }
          if ((Get-ChildItem "$HOME\.claude\agents" -Filter *.md).Count -ne $ExpectedAgents) { throw "Claude agent count mismatch" }
          if ((Get-ChildItem "$HOME\.gemini\skills" -Filter SKILL.md -Recurse).Count -ne $ExpectedSkills) { throw "Gemini skill count mismatch" }
          if ((Get-ChildItem "$HOME\.gemini\agents" -Filter *.md).Count -ne $ExpectedAgents) { throw "Gemini agent count mismatch" }
          $Drawing = "$HOME\.claude\skills\architectural-drawing-generation"
          python "$Drawing\scripts\aec_draw.py" "$Drawing\references\concept-plan.drawing.json" --validate-only
          if ($LASTEXITCODE -ne 0) { throw "drawing engine did not run from the installed skill" }
          pwsh -NoProfile -File .\scripts\install-global.ps1 all
          if ($LASTEXITCODE -ne 0) { throw "reinstall of owned items failed" }
          $env:CODEX_HOME = Join-Path $env:RUNNER_TEMP "aas-foreign"
          New-Item -ItemType Directory -Force "$env:CODEX_HOME\skills\drawing-qa" | Out-Null
          Set-Content "$env:CODEX_HOME\skills\drawing-qa\SKILL.md" "foreign"
          pwsh -NoProfile -File .\scripts\install-global.ps1 codex
          if ($LASTEXITCODE -ne 4) { throw "foreign skill did not block install (exit $LASTEXITCODE)" }
          if ((Get-Content "$env:CODEX_HOME\skills\drawing-qa\SKILL.md") -ne "foreign") { throw "foreign skill was modified" }
          pwsh -NoProfile -File .\scripts\install-global.ps1 codex -Force
          if ($LASTEXITCODE -ne 0) { throw "-Force install failed" }
          $Saved = Get-ChildItem "$env:CODEX_HOME\backups\*\skills\drawing-qa\SKILL.md"
          if ((Get-Content $Saved.FullName) -ne "foreign") { throw "foreign skill was not backed up" }
